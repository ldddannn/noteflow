services:
  - type: web
    name: noteflow-backend
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///noteflow.db
      - key: CORS_ORIGINS
        sync: false
